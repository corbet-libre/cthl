[package]
name = "cthl"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Throttle: rate limits with pluggable storage"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cthl.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[dependencies]
governor = { version = "0.10.4", default-features = false, features = ["std"] }

[dev-dependencies]
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt.git", branch = "v01" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
