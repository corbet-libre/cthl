name: ci

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version
      - name: Resolve and record dependencies
        run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-snapshot
          path: |
            Cargo.lock
            dependency-metadata.json
          retention-days: 7
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
