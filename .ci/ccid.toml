schema = 1
project = "cthl"

[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["ccid", "first-party"],
  ["bash", "-c", "cargo metadata --locked --format-version 1 > dependency-metadata.json"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
events = ["push", "manual"]
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

[jobs.verify-pr]
scheduler = "forgejo"
runs_on = "linux"
events = ["pull_request"]
checks = ["verify", "advisories"]
workflow = "pr"
command = ["bash", ".ci/run-cached.sh"]

[check_shell]

[coverage]
